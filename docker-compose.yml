services:
  mongo:
    image: mongo:7
    container_name: tracking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: tracking-kafka
    ports:
      - "29092:29092"   # host access (generator, scripts run outside Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 3                       # O-03 is still open; change per experiment
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Add these once the code exists. Inside Docker use mongo:27017 and kafka:9092.
  #
  # api:
  #   build: .
  #   command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
  #   ports: ["8000:8000"]
  #   environment:
  #     MONGO_URI: mongodb://mongo:27017
  #     KAFKA_BOOTSTRAP: kafka:9092
  #   depends_on:
  #     mongo: {condition: service_healthy}
  #
  # consumer:
  #   build: .
  #   command: python -m app.ingestion.consumer
  #   environment:
  #     MONGO_URI: mongodb://mongo:27017
  #     KAFKA_BOOTSTRAP: kafka:9092
  #   depends_on:
  #     mongo: {condition: service_healthy}
  #     kafka: {condition: service_started}

volumes:
  mongo_data:
  kafka_data: