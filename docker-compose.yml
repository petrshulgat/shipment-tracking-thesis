services:
  mongo:
    image: mongo:7
    container_name: tracking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tracking-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"     # Swagger UI: http://localhost:8000/docs
    environment:
      MONGO_URI: mongodb://mongo:27017   # inside Docker, MongoDB is reached by its service name
    depends_on:
      mongo: {condition: service_healthy}

  # Runs the batch ETL every day at 01:00 UTC (FR-11, D-20)
  etl-scheduler:
    build: .
    command: python -u -m app.etl.scheduler
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo: {condition: service_healthy}

  # Not started by `docker compose up`. Run with: docker compose run --rm --build benchmark
  benchmark:
    build: .
    profiles: ["benchmark"]
    command: python -m benchmarks.insert_benchmark
    environment:
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - ./benchmarks/results:/code/benchmarks/results   # results are saved on the host
    depends_on:
      mongo: {condition: service_healthy}

  # Run with: docker compose run --rm --build query-benchmark
  query-benchmark:
    build: .
    profiles: ["benchmark"]
    command: python -m benchmarks.query_benchmark
    environment:
      MONGO_URI: mongodb://mongo:27017
    volumes:
      - ./benchmarks/results:/code/benchmarks/results
    depends_on:
      mongo: {condition: service_healthy}
      benchmark-api: {condition: service_started}

  # A second API that reads the benchmark database, for the API-level measurements (D-34)
  benchmark-api:
    build: .
    profiles: ["benchmark"]
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: tracking_benchmark
    depends_on:
      mongo: {condition: service_healthy}

volumes:
  mongo_data:
