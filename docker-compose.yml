services:
  mongo:
    image: mongo:7
    container_name: tracking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tracking-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"     # Swagger UI: http://localhost:8000/docs
    environment:
      MONGO_URI: mongodb://mongo:27017   # inside Docker, MongoDB is reached by its service name
    depends_on:
      mongo: {condition: service_healthy}

volumes:
  mongo_data:
